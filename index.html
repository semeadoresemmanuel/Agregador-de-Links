<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ferramentas Semeadores</title>
    <meta name="description" content="Portal oficial da comunidade Semeadores. Acesso unificado ao Cronograma, Hinário Digital e Caixa de Sugestões.">
    
    <!-- Folha de Estilos Principal -->
    <link rel="stylesheet" href="index.css">

    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#002400">
    <meta name="color-scheme" content="dark">

    <!-- Suporte PWA / Tela Cheia Mobile -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ferramentas Semeadores">
    <meta name="application-name" content="Ferramentas Semeadores">
    <meta name="msapplication-TileColor" content="#002400">
    <link rel="apple-touch-icon" href="assets/icon-192.png">

    <!-- Favicon Unificado -->
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
</head>
<body>
    <div class="aggregator-wrapper">
        <main class="aggregator-card">
            <header class="profile-header">
                <div class="logo-wrapper">
                    <img src="assets/logo.svg" alt="Logo Semeadores" class="profile-logo" width="60" height="60" decoding="async" fetchpriority="high">
                </div>
            </header>

            <section class="links-stack" aria-label="Links Úteis">
                <!-- Link 1: Caixa de Sugestões -->
                <a href="./sugestoes/" class="link-button" aria-label="Abrir Caixa de Sugestões">
                    <img src="assets/caixadesugestoes.svg" alt="Caixa de Sugestões" class="btn-svg-icon" width="109" height="26" decoding="async">
                </a>

                <!-- Link 2: Cronograma -->
                <a href="./cronograma/" class="link-button" aria-label="Abrir Cronograma">
                    <img src="assets/cronograma.svg" alt="Cronograma" class="btn-svg-icon" width="86" height="26" decoding="async">
                </a>

                <!-- Link 3: Hinário -->
                <a href="./hinario/" class="link-button" aria-label="Abrir Hinário">
                    <img src="assets/hinario.svg" alt="Hinário" class="btn-svg-icon" width="64" height="26" decoding="async">
                </a>
            </section>
        </main>

        <footer class="profile-footer">
            <div class="copyright-wrapper">
                <img src="assets/copyright.svg" alt="Semeadores Copyright" class="copyright-icon" width="132" height="19" decoding="async" loading="lazy">
            </div>
        </footer>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
